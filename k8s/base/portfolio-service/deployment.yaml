# ============================================================
# IntelliWealth – Portfolio Service Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  namespace: intelliwealth
  labels:
    app: portfolio-service
    app.kubernetes.io/part-of: intelliwealth
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
        app.kubernetes.io/part-of: intelliwealth
    spec:
      containers:
        - name: portfolio-service
          image: ${ECR_REGISTRY}/intelliwealth/portfolio-service:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: portfolio-service-secret
            - configMapRef:
                name: portfolio-service-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
