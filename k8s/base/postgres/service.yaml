# ============================================================
# IntelliWealth – PostgreSQL Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: intelliwealth
  labels:
    app: postgres
    app.kubernetes.io/part-of: intelliwealth
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
