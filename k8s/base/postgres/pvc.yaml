# ============================================================
# IntelliWealth – PostgreSQL PersistentVolumeClaim
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: intelliwealth
  labels:
    app: postgres
    app.kubernetes.io/part-of: intelliwealth
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
