# ============================================================
# IntelliWealth – PostgreSQL ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: intelliwealth
  labels:
    app: postgres
    app.kubernetes.io/part-of: intelliwealth
data:
  PGDATA: /var/lib/postgresql/data/pgdata
  POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
  max_connections: "200"
  shared_buffers: "256MB"
  work_mem: "8MB"
