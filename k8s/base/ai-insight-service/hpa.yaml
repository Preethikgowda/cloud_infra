# ============================================================
# IntelliWealth – AI Insight Service HPA
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-insight-service-hpa
  namespace: intelliwealth
  labels:
    app: ai-insight-service
    app.kubernetes.io/part-of: intelliwealth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-insight-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
