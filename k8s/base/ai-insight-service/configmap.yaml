# ============================================================
# IntelliWealth – AI Insight Service ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-insight-config
  namespace: intelliwealth
  labels:
    app: ai-insight-service
    app.kubernetes.io/part-of: intelliwealth
data:
  LLM_PROVIDER: "mock"
  LLM_MAX_TOKENS: "1024"
  LLM_TEMPERATURE: "0.3"
  AWS_REGION: "us-east-1"
  BEDROCK_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
  PORTFOLIO_SERVICE_URL: "http://portfolio-service:8000"
  MARKET_SERVICE_URL: "http://market-service:8001"
  AI_SERVICE_HOST: "0.0.0.0"
  AI_SERVICE_PORT: "8002"
  AI_SERVICE_LOG_LEVEL: "info"
  AI_SERVICE_CORS_ORIGINS: "https://${DOMAIN_NAME}"
  ENVIRONMENT: "production"
