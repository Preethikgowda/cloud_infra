# ============================================================
# IntelliWealth – AI Insight Service Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-insight-service
  namespace: intelliwealth
  labels:
    app: ai-insight-service
    app.kubernetes.io/part-of: intelliwealth
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-insight-service
  template:
    metadata:
      labels:
        app: ai-insight-service
        app.kubernetes.io/part-of: intelliwealth
    spec:
      containers:
        - name: ai-insight-service
          image: ${ECR_REGISTRY}/intelliwealth/ai-insight-service:latest
          ports:
            - containerPort: 8002
              protocol: TCP
          envFrom:
            - secretRef:
                name: ai-insight-secret
            - configMapRef:
                name: ai-insight-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8002
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            failureThreshold: 20
            periodSeconds: 5
