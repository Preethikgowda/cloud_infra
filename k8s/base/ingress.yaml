# ============================================================
# IntelliWealth – ALB Ingress Controller (EKS Ready)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intelliwealth-ingress
  namespace: intelliwealth
  labels:
    app.kubernetes.io/part-of: intelliwealth
  annotations:
    # ---- AWS ALB Ingress Controller ----
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}, {"HTTP": 80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/group.name: intelliwealth
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/tags: >-
      Environment=production,Application=intelliwealth
spec:
  ingressClassName: alb
  rules:
    - host: "${DOMAIN_NAME}"
      http:
        paths:
          # Frontend (React SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # Portfolio Service API
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 8000
          - path: /api/v1/customers
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 8000
          - path: /api/v1/portfolio
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 8000

          # Market Intelligence Service API
          - path: /api/v1/market
            pathType: Prefix
            backend:
              service:
                name: market-service
                port:
                  number: 8001

          # AI Insight Service API
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: ai-insight-service
                port:
                  number: 8002
