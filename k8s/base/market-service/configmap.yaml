# ============================================================
# IntelliWealth – Market Service ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-service-config
  namespace: intelliwealth
  labels:
    app: market-service
    app.kubernetes.io/part-of: intelliwealth
data:
  MARKET_SERVICE_HOST: "0.0.0.0"
  MARKET_SERVICE_PORT: "8001"
  MARKET_SERVICE_LOG_LEVEL: "info"
  MARKET_SERVICE_CORS_ORIGINS: "https://${DOMAIN_NAME}"
  REDIS_CACHE_TTL: "300"
  REDIS_ANALYTICS_TTL: "600"
  ENVIRONMENT: "production"
