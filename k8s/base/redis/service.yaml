# ============================================================
# IntelliWealth – Redis Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: intelliwealth
  labels:
    app: redis
    app.kubernetes.io/part-of: intelliwealth
    app.kubernetes.io/component: cache
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
