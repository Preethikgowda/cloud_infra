# ============================================================
# IntelliWealth – AI Insight Service Kubernetes Deployment
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ai-insight-secret
  namespace: intelliwealth
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-insight-config
  namespace: intelliwealth
data:
  LLM_PROVIDER: "mock"
  LLM_MAX_TOKENS: "1024"
  LLM_TEMPERATURE: "0.3"
  AWS_REGION: "us-east-1"
  BEDROCK_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
  PORTFOLIO_SERVICE_URL: "http://portfolio-service:8000"
  MARKET_SERVICE_URL: "http://market-service:8001"
  AI_SERVICE_HOST: "0.0.0.0"
  AI_SERVICE_PORT: "8002"
  ENVIRONMENT: "production"
  AI_SERVICE_CORS_ORIGINS: "https://intelliwealth.io"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-insight-service
  namespace: intelliwealth
  labels:
    app: ai-insight-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-insight-service
  template:
    metadata:
      labels:
        app: ai-insight-service
    spec:
      containers:
        - name: ai-insight-service
          image: intelliwealth/ai-insight-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: ai-insight-secret
            - configMapRef:
                name: ai-insight-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-insight-service
  namespace: intelliwealth
spec:
  selector:
    app: ai-insight-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
