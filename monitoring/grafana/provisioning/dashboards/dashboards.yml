# ============================================================
# IntelliWealth – Grafana Dashboard Provisioning
# ============================================================
apiVersion: 1

providers:
  - name: IntelliWealth
    orgId: 1
    folder: IntelliWealth
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
